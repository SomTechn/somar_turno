<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Somar Turno · Demo</title>

<style>
/* Layout: one phone-width app column. Quiet white surfaces, ink buttons; the plum accent is kept for selection and the turn ticket. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#16181D; --ink-2:#555C68; --ink-3:#8A909B; --line:#E2E5EA;
  --accent:#6A3EA1; --accent-soft:#F2ECF9; --on-ink:#FFFFFF;
  --good:#15804D; --good-soft:#E4F4EB; --warn:#9A5B05; --warn-soft:#FCF1DE; --bad:#C0344A; --bad-soft:#FBE8EB;
  --scrim:rgba(16,18,24,.42);
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-sm:10px; --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1014; --surface:#181A20; --sunk:#20232B; --ink:#EEF0F4; --ink-2:#AEB4BF; --ink-3:#7D8490; --line:#2A2E37;
  --accent:#B896EE; --accent-soft:#2A2238; --on-ink:#0F1014;
  --good:#4FC489; --good-soft:#143326; --warn:#F0B35C; --warn-soft:#352812; --bad:#F27D8F; --bad-soft:#3A1C23;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1014; --surface:#181A20; --sunk:#20232B; --ink:#EEF0F4; --ink-2:#AEB4BF; --ink-3:#7D8490; --line:#2A2E37;
  --accent:#B896EE; --accent-soft:#2A2238; --on-ink:#0F1014;
  --good:#4FC489; --good-soft:#143326; --warn:#F0B35C; --warn-soft:#352812; --bad:#F27D8F; --bad-soft:#3A1C23;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.mark{width:26px;height:26px;display:grid;place-items:center;flex:none}.mark img{width:100%;height:100%;display:block}
.mark svg{width:16px;height:16px}
.demo{font-size:13px;color:var(--ink-3)}
.roles{display:flex;gap:4px;padding-block:0 10px;overflow-x:auto;scrollbar-width:none}
.roles button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.screen{display:flex;flex-direction:column;gap:20px;padding-block:20px 28px}
.title{display:flex;flex-direction:column;gap:4px}
.title h1{font-size:28px;font-weight:800;line-height:1.1}
.title p{color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.sec-h h2{font-size:17px;font-weight:700}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .sm{font-size:14px} .xs{font-size:13px}
.b{font-weight:700}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);min-width:0;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item.top-al{align-items:flex-start}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .l1{font-weight:600;overflow-wrap:anywhere}
.item .l2{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.chev{color:var(--ink-3);font-size:20px;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.soft{background:var(--accent-soft);border-color:transparent}
.panel.warn{background:var(--warn-soft);border-color:transparent}
.panel.bad{background:var(--bad-soft);border-color:transparent}
.hr{height:1px;background:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--ink-2);align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:10px 16px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.wa{background:#1DA851;border-color:#1DA851;color:#fff}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.s{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:15px}

.tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.g{background:var(--good-soft);color:var(--good)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--bad-soft);color:var(--bad)}
.star{color:#E0A100}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--ink-2)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{border:0;background:transparent;min-height:46px;flex:1;min-width:0;outline:none}

.mono{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;letter-spacing:-.02em}
.mono.s{width:38px;height:38px;font-size:14px;border-radius:10px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink-2)}
.biz{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}
.biz .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.biz .name{font-weight:700;font-size:17px;letter-spacing:-.01em}
.fav{border:0;background:transparent;padding:4px;color:var(--ink-3);flex:none}
.fav svg{width:22px;height:22px}
.fav[aria-pressed="true"]{color:var(--bad)}

/* The turn ticket: a perforated stub with the number you wait for. */
.ticket{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 18px;align-items:center;background:var(--accent);color:var(--on-ink);border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;
  -webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 9px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.ticket .n{grid-row:span 3;font-size:56px;font-weight:800;line-height:.9;letter-spacing:-.04em;padding-right:18px;border-right:2px dashed color-mix(in srgb,var(--on-ink) 35%,transparent)}
.ticket .k{font-size:13px;opacity:.85}
.ticket .big{font-size:19px;font-weight:700}
.ticket.called{background:var(--good);color:#fff}
.ticket.called .n{border-color:rgba(255,255,255,.4)}
.tn{flex:none;font-weight:800;font-size:18px;min-width:46px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;padding:5px 4px;font-variant-numeric:tabular-nums}
.tn.on{border-style:solid;border-color:var(--good);color:var(--good)}

.bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3);position:relative}
.tabs svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--ink)}
.dot{position:absolute;top:5px;left:calc(50% + 5px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

.wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{background:var(--bg);width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0;flex:none}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh h2{font-size:21px;font-weight:800}
.x{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;color:var(--ink-2);flex:none;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:10px 12px;width:100%;min-width:0}
.f textarea{min-height:78px;resize:vertical}
.f .hint{font-size:13px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-weight:700}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.slot{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 2px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.day{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-width:58px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;color:var(--ink-2)}
.day b{font-size:19px;color:var(--ink)}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.day[aria-pressed="true"] b{color:var(--on-ink)}
.day:disabled{opacity:.35}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stars-in{display:flex;gap:2px}
.stars-in button{border:0;background:transparent;font-size:34px;line-height:1;color:var(--line);padding:2px}
.stars-in button.on{color:#E0A100}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch{flex:none;width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:23px}
.bank{display:flex;align-items:center;gap:12px}
.bank .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.acct{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.upload{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.proof{max-width:100%;max-height:360px;border-radius:12px;border:1px solid var(--line);align-self:center;background:#fff}
.wa-b{align-self:flex-start;background:#DCF8C6;color:#111;border-radius:4px 14px 14px 14px;padding:10px 12px;max-width:88%;font-size:15px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:13px;color:var(--ink-3);font-weight:600;border-top:0}
.r{text-align:right}
.qr{background:#fff;padding:12px;border-radius:12px;display:grid;place-items:center;align-self:center}
.reply{border-left:3px solid var(--line);padding-left:10px;font-size:14px;color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);padding:22px 14px;font-size:15px}
.note{background:var(--warn-soft);border-radius:8px;padding:6px 9px;font-size:14px}

.push{position:fixed;left:50%;transform:translate(-50%,-150%);top:calc(10px + env(safe-area-inset-top,0px));width:min(456px,calc(100% - 24px));z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:transform .35s ease;cursor:pointer}
.push.show{transform:translate(-50%,0)}
.push .body{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;width:max-content;max-width:calc(100% - 32px);text-align:center}
.tv{position:fixed;inset:0;z-index:80;background:#101218;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.tv .now{font-size:min(34vw,180px);font-weight:800;line-height:1;letter-spacing:-.05em;color:#C9A8FF}
.tv .nx{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tv .nx span{font-size:28px;font-weight:800;border:2px dashed rgba(255,255,255,.35);border-radius:12px;padding:4px 14px}
@media (prefers-reduced-motion:reduce){.push,.switch::after{transition:none}}
</style>

<body>

<div id="app">
  <header class="top">
    <div class="top-row gut">
      <div class="brand"><span class="mark"><img src="/assets/img/icon.svg" alt="" width="26" height="26"></span>Somar Turno</div>
      <div style="display:flex;align-items:center;gap:6px"><a class="btn s ink" href="/panel" style="min-height:32px">Para mi negocio</a><button class="btn quiet s" data-a="askReset" aria-label="Reiniciar la demo" title="Reiniciar la demo" style="padding:6px 8px">↺</button></div>
    </div>
    <div class="roles gut" role="group" aria-label="Ver la app como">
      <button data-a="setRole" data-p="cliente" data-role="cliente">Cliente</button>
      <button data-a="setRole" data-p="negocio" data-role="negocio">Negocio</button>
      <button data-a="setRole" data-p="pro" data-role="pro">Profesional</button>
      <button data-a="setRole" data-p="somar" data-role="somar">Somar</button>
    </div>
  </header>
  <main class="screen gut" id="screen"></main>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</div>
<div class="push" id="push" role="status" aria-live="polite" data-a="pushTap"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<div id="tvHost"></div>

<script>
/* =================== Utilidades =================== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const T=iso(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const h2m=h=>{const [a,b]=h.split(':').map(Number);return a*60+b;};
const m2h=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const h12=h=>{const m=h2m(h);let H=Math.floor(m/60);const M=m%60,ap=H<12?'a.\u00a0m.':'p.\u00a0m.';H=H%12||12;return H+':'+pad(M)+' '+ap;};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fLbl=s=>{if(s===T)return'Hoy';if(s===addDays(T,1))return'Mañana';if(s===addDays(T,-1))return'Ayer';const d=new Date(s+'T12:00:00');return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];};
const dBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

const negRt=n=>{const r=D.cals.filter(q=>q.neg===n);return{v:avg(r.map(q=>q.en)),n:r.length};};
const proRt=p=>{const r=D.cals.filter(q=>q.pro===p);return{v:avg(r.map(q=>q.ep)),n:r.length};};
const rtTxt=(r,min)=>r.n<(min||1)?'<span class="tag">Nuevo</span>':`<span><span class="star">★</span> <b class="num">${r.v.toFixed(1)}</b> <span class="faint num">(${r.n})</span></span>`;
const ptsOf=(c,n)=>D.puntos.filter(m=>m.cli===c&&m.neg===n).reduce((a,m)=>a+m.pts,0);
const isOpen=n=>{const h=n.horario[new Date().getDay()];if(!h)return false;const m=nowMin();return m>=h[0]*60&&m<h[1]*60;};
const horaHoy=n=>{const h=n.horario[new Date().getDay()];return h?`${h12(m2h(h[0]*60))} a ${h12(m2h(h[1]*60))}`:'Cerrado hoy';};
const waiting=n=>D.fila.filter(f=>f.neg===n&&f.estado==='esperando').sort((a,b)=>a.num-b.num);
const called=n=>D.fila.filter(f=>f.neg===n&&f.estado==='llamado');
const ahead=f=>D.fila.filter(x=>x.neg===f.neg&&x.estado==='esperando'&&x.num<f.num).length;
const wait=(n,a)=>Math.max(5,Math.round((a+1)*30/Math.max(1,prosOf(n).length)/5)*5);
const fName=f=>f.cli?cli(f.cli).nombre:(f.nombre||'Cliente');
const myTurn=()=>D.me&&D.fila.find(f=>f.cli===D.me&&['esperando','llamado'].includes(f.estado));
const myCitas=()=>D.me?D.citas.filter(c=>c.cli===D.me&&['reservada','confirmada'].includes(c.estado)&&(c.fecha>T||(c.fecha===T&&h2m(c.hora)+serv(c.serv).dur>nowMin()-60))).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)):[];
const myPending=()=>D.me?D.visitas.filter(v=>v.cli===D.me&&['por_comprobante','rechazado'].includes(v.pago.estado)):[];
const toRate=()=>hasAcct()?D.visitas.filter(v=>v.cli===D.me&&!v.calificada&&v.pago.estado==='pagado'&&dBetween(v.fecha,T)<=7):[];
const clientsOf=n=>{const s=new Set([...D.visitas.filter(v=>v.neg===n).map(v=>v.cli),...D.citas.filter(c=>c.neg===n).map(c=>c.cli),...D.fila.filter(f=>f.neg===n).map(f=>f.cli)].filter(Boolean));return[...s].map(cli);};
const unread=()=>D.notifs.filter(n=>n.cli===D.me&&!n.leida).length;
const porConfirmar=n=>D.visitas.filter(v=>v.neg===n&&v.pago.estado==='por_confirmar');
const overlap=(a,da,b,db)=>a<b+db&&b<a+da;
function slots(n,fecha,dur,p,ignore){
  const h=neg(n).horario[new Date(fecha+'T12:00:00').getDay()];if(!h)return[];
  const out=[],lim=fecha===T?nowMin()+10:-1,ids=p?[p]:prosOf(n).map(x=>x.id);
  for(let t=h[0]*60;t+dur<=h[1]*60;t+=30){
    if(t<=lim)continue;
    const free=ids.find(id=>!D.citas.some(c=>c.id!==ignore&&c.pro===id&&c.fecha===fecha&&['reservada','confirmada'].includes(c.estado)&&overlap(t,dur,h2m(c.hora),serv(c.serv).dur)));
    if(free)out.push({t,pro:free});
  }
  return out;
}

/* ---- Reservar ---- */
let R=null;
function reservar(n,s,p,rep){
  const c=rep?D.citas.find(x=>x.id===rep):null;
  R={neg:n,serv:s||(c?c.serv:null),pro:p!==undefined&&p!==''?p:(c?c.pro:undefined),fecha:null,slot:null,rep:rep||null};
  if(p===''&&!rep)R.pro=undefined;
  R.step=!R.serv?1:R.pro===undefined?2:3;
  if(R.step===3)R.fecha=firstDay();
  F={};openSheet(rReserva);
}
function firstDay(){for(let i=0;i<14;i++){const f=addDays(T,i);if(slots(R.neg,f,serv(R.serv).dur,R.pro||null,R.rep).length)return f;}return T;}
function rReserva(){
  const n=neg(R.neg),st=R.step;
  const steps=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  const back=st>1?`<button class="link" style="align-self:flex-start" ${act('rBack')}>‹ Atrás</button>`:'';
  if(st===1)return`${head(R.rep?'Cambiar cita':'Reservar cita')}${steps}<p class="muted">${esc(n.nombre)}. ¿Qué te vas a hacer?</p><div class="opts">${servsOf(n.id).map(s=>`<button class="opt" aria-pressed="${R.serv===s.id}" ${act('rServ',s.id)}><b>${esc(s.nombre)}</b><span class="sm muted num">${L(s.precio)}, ${s.dur} min</span></button>`).join('')}</div>`;
  if(st===2)return`${head('¿Con quién?')}${steps}${back}<div class="opts"><button class="opt" aria-pressed="${R.pro===null}" ${act('rPro','')}><b>Cualquiera</b><span class="sm muted">El primero libre</span></button>${prosOf(n.id).map(p=>`<button class="opt" aria-pressed="${R.pro===p.id}" ${act('rPro',p.id)}><b>${esc(first(p.nombre))}</b><span class="sm muted">${esc(p.rol)}</span><span class="sm">${rtTxt(proRt(p.id),5)}</span></button>`).join('')}</div>`;
  if(st===3){
    const s=serv(R.serv),days=[...Array(10)].map((_,i)=>addDays(T,i)),sl=slots(n.id,R.fecha,s.dur,R.pro||null,R.rep);

/* ---- Cobrar (atendido) ---- */
function cobrar(kind,id,pfix){
  const o=kind==='cita'?D.citas.find(x=>x.id===id):D.fila.find(x=>x.id===id);
  F={kind,id,neg:o.neg,cli:o.cli,pro:pfix||o.pro||prosOf(o.neg)[0].id,serv:o.serv,monto:null,metodo:'efectivo',via:null,canje:'',cuenta:neg(o.neg).cuentas[0]?.id||'',ref:'',comp:null,pfix:!!pfix};
  const c=F.cli?cli(F.cli):null;F.via=c&&c.cuenta?'cliente':'yo';
  openSheet(rCobro);
}
const cobroMonto=()=>F.canje?0:(F.monto!==null?F.monto:serv(F.serv).precio);
function rCobro(){
  const n=neg(F.neg),c=F.cli?cli(F.cli):null,acct=c&&c.cuenta,pts=acct?ptsOf(c.id,n.id):0,disp=n.recompensas.filter(r=>r.pts<=pts),m=cobroMonto();
  const earn=acct&&!F.canje?Math.floor(m/n.lpp):0,refB=acct&&c.referidoPor&&!c.refPagado;
  const tr=F.metodo==='transferencia';
  let btn='Cobrar '+L(m);
  if(tr&&F.via==='cliente')btn='Pedir comprobante al cliente';
  if(tr&&F.via==='yo')btn='Confirmar transferencia de '+L(m);
  return`${head('Cobrar')}<p class="muted">${c?esc(c.nombre)+(acct?`, ${pts} puntos aquí`:', sin cuenta'):'Cliente sin registro'}</p>
  <div class="f"><label for="kS">Servicio</label><select id="kS" data-m="serv" data-redraw="1">${servsOf(n.id).map(s=>`<option value="${s.id}" ${s.id===F.serv?'selected':''}>${esc(s.nombre)}, ${L(s.precio)}</option>`).join('')}</select></div>
  ${F.pfix?'':`<div class="f"><label for="kP">Lo atendió</label><select id="kP" data-m="pro">${prosOf(n.id).map(p=>`<option value="${p.id}" ${p.id===F.pro?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>`}
  ${disp.length?`<div class="f"><label for="kC">Canjear puntos</label><select id="kC" data-m="canje" data-redraw="1"><option value="">No canjear</option>${disp.map(r=>`<option value="${r.id}" ${F.canje===r.id?'selected':''}>${esc(r.nombre)}, ${r.pts} puntos</option>`).join('')}</select></div>`:''}
  <div class="f"><label for="kM">Monto (L)</label><input id="kM" data-m="monto" data-num="1" data-redraw="1" inputmode="numeric" class="num" value="${m}" ${F.canje?'disabled':''}></div>
  ${m>0?`<div class="seg" role="group" aria-label="Forma de pago"><button aria-pressed="${!tr}" ${act('setF','metodo','efectivo')}>Efectivo</button><button aria-pressed="${tr}" ${act('setF','metodo','transferencia')}>Transferencia</button></div>`:''}
  ${tr&&m>0?`${acct?`<div class="seg" role="group" aria-label="Quién sube el comprobante"><button aria-pressed="${F.via==='cliente'}" ${act('setF','via','cliente')}>Lo sube el cliente</button><button aria-pressed="${F.via==='yo'}" ${act('setF','via','yo')}>Lo registro yo</button></div>`:''}
    ${F.via==='cliente'?`<p class="sm muted">${esc(first(c.nombre))} recibe un aviso en su app con tus cuentas para subir el comprobante. El cobro queda pendiente hasta que lo confirmés.</p>`:
    n.cuentas.length?`<div class="f"><label for="kB">Cuenta donde entró</label><select id="kB" data-m="cuenta">${n.cuentas.map(b=>`<option value="${b.id}" ${b.id===F.cuenta?'selected':''}>${esc(b.banco)}, ${esc(b.numero)}</option>`).join('')}</select></div>
    <div class="f"><label for="kR">Referencia</label><input id="kR" data-m="ref" inputmode="numeric" value="${esc(F.ref)}" placeholder="Número de la transferencia"></div>
    <label class="upload" for="kF">${F.comp?`<img class="proof" src="${F.comp}" alt="Comprobante">`:`<b>Foto del comprobante</b><span class="sm muted">Opcional</span>`}<input id="kF" type="file" accept="image/*" data-file="comp"></label>
    <p class="sm muted">Confirmá solo si ya viste el dinero en tu cuenta.</p>`:`<div class="panel warn"><span class="sm">Todavía no agregaste cuentas bancarias.</span><div><button class="btn s" ${act('openMasFromSheet','cuentas')}>Agregar cuenta</button></div></div>`}`:''}
  ${acct&&!(tr&&F.via==='cliente')?`<div class="panel soft" style="padding:12px"><span class="sm">Gana <b class="num">${earn}</b> puntos.${refB?` Es su primera visita con código de amigo: ${esc(first(c.nombre))} y ${esc(first(cli(c.referidoPor).nombre))} ganan ${n.ptsRef} puntos extra cada uno.`:''}</span></div>`:''}
  <button class="btn good full" ${tr&&F.via==='yo'&&!n.cuentas.length?'disabled':''} ${act('doCobro')}>${btn}</button>`;
}
function applyPago(v){
  const n=neg(v.neg),c=v.cli?cli(v.cli):null;v.pago.estado='pagado';
  if(!c||!c.cuenta)return;
  const pts=v.canje?0:Math.floor(v.monto/n.lpp);
  if(pts)D.puntos.push({id:uid('m'),cli:c.id,neg:n.id,pts,motivo:'Visita: '+serv(v.serv).nombre,fecha:T});
  if(c.referidoPor&&!c.refPagado){c.refPagado=true;const a=cli(c.referidoPor);
    D.puntos.push({id:uid('m'),cli:c.id,neg:n.id,pts:n.ptsRef,motivo:'Bono por código de amigo',fecha:T});
    D.puntos.push({id:uid('m'),cli:a.id,neg:n.id,pts:n.ptsRef,motivo:`${first(c.nombre)} usó tu código`,fecha:T});
    notify(a.id,`Ganaste ${n.ptsRef} puntos`,`${first(c.nombre)} pagó su primera visita en ${n.nombre} con tu código.`);}
  notify(c.id,`Gracias por tu visita a ${n.nombre}`,(pts?`Ganaste ${pts} puntos. `:'')+'¿Nos calificás? Tenés 7 días.');
}
function doCobro(){
  const n=neg(F.neg),m=cobroMonto(),tr=F.metodo==='transferencia'&&m>0;
  const v={id:uid('v'),neg:n.id,cli:F.cli,pro:F.pro,serv:F.serv,monto:m,fecha:T,hora:m2h(nowMin()),calificada:false,canje:F.canje||null,pago:{metodo:tr?'transferencia':'efectivo',estado:'pagado',cuenta:null,ref:'',comp:null}};
  D.visitas.push(v);
  if(F.kind==='cita')D.citas.find(x=>x.id===F.id).estado='atendida';else{const f=D.fila.find(x=>x.id===F.id);f.estado='atendido';f.pro=F.pro;checkFila(n.id);}
  if(F.canje){const r=n.recompensas.find(x=>x.id===F.canje);D.puntos.push({id:uid('m'),cli:F.cli,neg:n.id,pts:-r.pts,motivo:'Canje: '+r.nombre,fecha:T});}
  let msg='Cobrado '+L(m)+(tr?' por transferencia':m?' en efectivo':'');
  if(tr&&F.via==='cliente'){v.pago.estado='por_comprobante';notify(F.cli,'Subí tu comprobante de pago',`${L(m)} en ${n.nombre}. Tocá para ver las cuentas.`);msg='Esperando el comprobante del cliente';}
  else{if(tr)Object.assign(v.pago,{cuenta:F.cuenta,ref:F.ref,comp:F.comp,subido:'negocio'});applyPago(v);}
  closeSheet();toast(msg);render();
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.a==='scrim'){if(ev.target===el)closeSheet();return;}
  if(el.tagName==='A')return;
  ev.preventDefault();
  const p=el.dataset.p!==undefined?el.dataset.p.split('|'):[];
  fn(...p);
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role="button"][data-a]')){ev.preventDefault();ev.target.click();}});
document.addEventListener('input',ev=>{
  const el=ev.target,d=el.dataset;
  if(d.m!==undefined&&el.tagName!=='SELECT'){F[d.m]=d.num?(parseInt(el.value)||0):el.value;}
  if(d.i==='search'){UI.q=el.value;const pos=el.selectionStart;render();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
  if(d.i==='cliSearch'){UI.cliQ=el.value;const pos=el.selectionStart;render();const q=document.getElementById('cq');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
  if(d.note){cli(d.note).notas[ON().id]=el.value;}
  if(d.neg){ON()[d.neg]=el.value;}
  if(d.rg){F.rg[d.rg]=el.value;}
});
document.addEventListener('change',ev=>{
  const el=ev.target,d=el.dataset;
  if(d.m!==undefined&&el.tagName==='SELECT'){F[d.m]=d.num?(parseInt(el.value)||0):el.value;if(d.m==='serv'&&F.monto!==undefined)F.monto=null;if(d.m==='cli'||d.m==='serv'||d.m==='pro')F.t=F.t===undefined?undefined:null;if(d.redraw)drawSheet();}
  if(d.m!==undefined&&el.tagName!=='SELECT'&&d.redraw)drawSheet();
  if(d.negnum){ON()[d.negnum]=Math.max(d.negnum==='lpp'?1:0,parseInt(el.value)||0);render();}
  if(d.pick==='pro'){D.pro=el.value;render();}
  if(d.plan){neg(d.plan).plan=el.value;toast('Plan cambiado');render();}
  if(d.file&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{F[d.file]=r.result;drawSheet();};r.readAsDataURL(el.files[0]);}
});
